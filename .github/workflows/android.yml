name: Android

on:
  push:
    branches:
      - android-port
    paths:
      - "android/**"
      - "crates/android-bridge/**"
      - "crates/mobile-core/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/android-bridge/**"
      - "crates/mobile-core/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android components
        shell: bash
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: android
          cache-all-crates: false
          cache-on-failure: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Check Rust bridge
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p tg-ws-proxy-android -p tg-ws-proxy-mobile --all-targets -- -D warnings
          cargo test --locked -p tg-ws-proxy-android -p tg-ws-proxy-mobile

      - name: Test, lint and build Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -name '*universal*debug.apk' -print -quit)"
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libtg_ws_proxy_android.so'
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libtg_ws_proxy_android.so'
          unzip -l "$apk" | grep -q 'lib/x86_64/libtg_ws_proxy_android.so'
