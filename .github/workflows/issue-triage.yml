name: Auto comment on new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### Перед отчётом

            - проверьте проблему на последней
              [Rust-сборке](https://github.com/danusha2345/tg-ws-proxy/releases);
            - сверьтесь с
              [README и инструкцией для своей ОС](https://github.com/danusha2345/tg-ws-proxy/blob/rust-port/docs/README.md);
            - учитывайте, что Rust-версия пока тестовая и нуждается в проверке
              на реальных окружениях.

            Пожалуйста, укажите:

            1. версию и архитектуру ОС;
            2. имя скачанного файла, режим CLI или tray;
            3. проверяемый маршрут: direct WebSocket, Worker/CfProxy, TCP
               fallback или Fake TLS;
            4. точные шаги, ожидаемый и фактический результат;
            5. логи, если они доступны.

            Не публикуйте proxy secret, токены и другие credentials.
