name: iOS

on:
  push:
    branches:
      - ios-port
    paths:
      - "ios/**"
      - "crates/ios-bridge/**"
      - "crates/mobile-core/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "crates/ios-bridge/**"
      - "crates/mobile-core/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test bridge and build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: ios
          cache-all-crates: false
          cache-on-failure: false

      - name: Check Rust bridge
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p tg-ws-proxy-ios -p tg-ws-proxy-mobile --all-targets -- -D warnings
          cargo test --locked -p tg-ws-proxy-ios -p tg-ws-proxy-mobile

      - name: Build unsigned IPA
        working-directory: ios
        run: ./build.sh device

      - name: Validate IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa="ios/dist/TgWsProxy-unsigned.ipa"
          test -s "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/TG WS Proxy.app/TG WS Proxy'
          unzip -l "$ipa" | grep -q 'Payload/TG WS Proxy.app/Info.plist'

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TgWsProxy-unsigned-ipa
          path: ios/dist/TgWsProxy-unsigned.ipa
          if-no-files-found: error
