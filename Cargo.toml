[package]
name = "tg-ws-proxy"
version = "1.9.1"
edition = "2024"
rust-version = "1.85"
description = "Telegram Desktop WebSocket bridge proxy"
license = "MIT"
repository = "https://github.com/danusha2345/tg-ws-proxy"
default-run = "tg-ws-proxy"
include = [
    "src/**",
    "tests/**",
    "assets/**",
    "build.rs",
    "icon.ico",
    "Cargo.toml",
    "Cargo.lock",
    "rustfmt.toml",
    "LICENSE",
    "docs/RUST_PORT.md",
]

[workspace]
members = ["crates/android-bridge", "crates/ios-bridge", "crates/mobile-core"]
resolver = "2"

[lib]
name = "tg_ws_proxy"
path = "src/lib.rs"

[[bin]]
name = "tg-ws-proxy"
path = "src/main.rs"

[[bin]]
name = "tg-ws-proxy-desktop"
path = "src/bin/tg-ws-proxy-desktop.rs"
required-features = ["desktop"]

[features]
default = []
desktop = [
    "dep:arboard",
    "dep:directories",
    "dep:fs2",
    "dep:ksni",
    "dep:native-dialog",
    "dep:open",
    "dep:reqwest",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:tray-icon",
    "dep:winit",
]

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
ctr = "0.10.1"
directories = { version = "6.0.0", optional = true }
futures-util = { version = "0.3.33", features = ["sink"] }
fs2 = { version = "0.4.3", optional = true }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
open = { version = "5.4.0", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
semver = { version = "1.0.27", optional = true }
sha2 = "0.11.0"
socket2 = "0.6.5"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
webpki-roots = "1.0.9"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, optional = true }
winit = { version = "0.30.12", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
native-dialog = { version = "0.9.7", features = ["windows_dpi_awareness", "windows_visual_styles"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.23"

[dev-dependencies]
proptest = "1.10.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
