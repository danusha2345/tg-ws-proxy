[package]
name = "tg-ws-proxy-ios"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "tgwsproxy"
crate-type = ["staticlib", "lib"]

[dependencies]
tg-ws-proxy-mobile = { path = "../mobile-core" }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
