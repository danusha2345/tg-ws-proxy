[package]
name = "tg-ws-proxy-android"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "tg_ws_proxy_android"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
jni = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tg-ws-proxy = { path = "../.." }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
